name: Release

# One semver tag drives both artifacts: the VS Code extension (VSIX) and the
# npm package (@supanadit/morse-web). Push `v<major>.<minor>.<patch>`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Secrets and variables live on this environment (Settings → Environments):
    # NPM_TOKEN (secret) and PUBLISH_MARKETPLACE (variable). It is also where an
    # approval gate would go, and where a Marketplace publishing policy is scoped.
    environment: Morse
    env:
      # Marketplace PAT (Settings → Environments → Morse → Secrets). Empty while
      # Marketplace publishing is off, in which case the step below is skipped.
      # `vsce publish --oidc` is not usable yet: vsce 4.0.0 calls the token
      # exchange without an api-version and the Marketplace answers 400.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish when a manifest disagrees with the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const want = process.env.VERSION;
            const files = [
              "package.json",
              "packages/extension/package.json",
              "packages/morse-web/package.json",
            ];
            for (const file of files) {
              const got = JSON.parse(readFileSync(file, "utf8")).version;
              if (got !== want) {
                console.error(`${file} is ${got}, but the tag is ${want}.`);
                console.error(`Run: npm version ${want} --workspaces --include-workspace-root --no-git-tag-version`);
                process.exit(1);
              }
            }
            console.log(`All manifests are ${want}.`);
          '

      - name: Install
        run: npm ci

      # Every workspace resolves `@morse/*` through the libraries' built `dist/`,
      # so the build must come before anything that type-checks.
      - name: Build the extension, the server and the frontend
        run: npm run build

      - name: Type-check
        run: npm run check-types

      - name: Unit tests
        run: npm run test:fast

      - name: Build the npm artifact
        run: npm run build -w @supanadit/morse-web

      - name: Package the VSIX
        run: npm run vsix -w morse

      - name: Publish the npm package
        run: npm publish -w @supanadit/morse-web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract this version's release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const lines = readFileSync("packages/extension/CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((line) => line === `## ${version}` || line.startsWith(`## ${version} `));
            const notes = [];
            for (let index = start + 1; start !== -1 && index < lines.length; index += 1) {
              if (lines[index].startsWith("## ")) break;
              notes.push(lines[index]);
            }
            // Empty when this version has no section: the release step then falls
            // back to the notes GitHub generates from commits.
            writeFileSync("RELEASE_NOTES.md", notes.join("\n").trim().length > 0 ? `${notes.join("\n").trim()}\n` : "");
            console.log(`release notes for ${version}: ${notes.join("\n").trim().length} characters`);
          '

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # The body is this version's changelog section, so the release page reads
          # like the project's own notes instead of a list of commit subjects.
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$tag" dist/morse.vsix \
              --title "Morse $tag" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" dist/morse.vsix \
              --title "Morse $tag" \
              --generate-notes
          fi

      - name: Publish the VSIX to the VS Code Marketplace
        if: vars.PUBLISH_MARKETPLACE == 'true' && env.VSCE_PAT != ''
        run: ./node_modules/.bin/vsce publish --packagePath dist/morse.vsix -p "$VSCE_PAT"
