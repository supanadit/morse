name: Release container image

# The same semver tag that releases the VSIX and the npm package also bakes and
# publishes the server image. Kept as a sibling of release.yml so a registry
# failure cannot hold up (or be held up by) the other artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write # push to ghcr.io with the automatic GITHUB_TOKEN — no PAT needed

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Publish ghcr.io/supanadit/morse/server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semver release tag (vX.Y.Z)."
            exit 1
          fi
          # The image is built from source, so its baked version is the one in
          # the manifest. Refuse to label it with a version it does not contain.
          baked="$(node -p "require('./packages/morse-web/package.json').version")"
          if [ "$baked" != "$version" ]; then
            echo "::error::packages/morse-web/package.json is $baked but the tag is $version."
            echo "Run: npm version $version --workspaces --include-workspace-root --no-git-tag-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Resolve at release time, not at Dockerfile authoring time: a cached
      # `latest` layer would otherwise bake yesterday's engines into a new tag.
      # Explicit args also make the exact shipped versions visible in the log.
      # Pinned builds are a manual choice (pass build args yourself), never a
      # release default.
      - name: Resolve current engine versions
        id: engines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pi="$(npm view @earendil-works/pi-coding-agent version)"
          opencode="$(gh api repos/sst/opencode/releases/latest --jq .tag_name)"
          if [[ ! "$pi" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Could not resolve a released pi version (got: $pi)."
            exit 1
          fi
          if [[ ! "$opencode" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Could not resolve an OpenCode release tag (got: $opencode)."
            exit 1
          fi
          echo "pi=$pi" >> "$GITHUB_OUTPUT"
          echo "opencode=$opencode" >> "$GITHUB_OUTPUT"
          echo "Release engines: pi $pi, OpenCode $opencode"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile COPYs every workspace package, so the context is the
          # whole monorepo, not packages/morse-web/container.
          context: .
          file: packages/morse-web/container/Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            PI_VERSION=${{ steps.engines.outputs.pi }}
            OPENCODE_VERSION=${{ steps.engines.outputs.opencode }}
          tags: |
            ghcr.io/supanadit/morse/server:${{ steps.version.outputs.version }}
            ghcr.io/supanadit/morse/server:latest
          cache-from: type=registry,ref=ghcr.io/supanadit/morse/server:buildcache
          cache-to: type=registry,ref=ghcr.io/supanadit/morse/server:buildcache,mode=max,ignore-error=true

      - name: Report the published image
        run: echo "Published ghcr.io/supanadit/morse/server:${{ steps.version.outputs.version }} (${{ steps.build.outputs.digest }})"
