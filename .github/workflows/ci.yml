name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node-pty is the browser host's terminal and ships no Linux prebuild, so
      # `npm ci` compiles it. Make sure the toolchain node-gyp needs is present
      # before the install, or the whole job dies on a native build.
      - name: Ensure a C++ toolchain for node-pty
        run: |
          if ! command -v g++ >/dev/null || ! command -v make >/dev/null || ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3
          fi

      - name: Install
        run: npm ci

      # Every workspace resolves `@morse/*` through the libraries' built `dist/`
      # (the `main`/`types` fields point there), so the libraries must exist
      # before any type-check. This is why the order matches the repo's
      # "Done = build + check-types + test:fast".
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:fast

      - name: Dry-run the npm artifact
        run: npm pack -w @supanadit/morse-web --dry-run

  vscode:
    name: VS Code integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Same native build as the job above: node-pty has no Linux prebuild.
      - name: Ensure a C++ toolchain for node-pty
        run: |
          if ! command -v g++ >/dev/null || ! command -v make >/dev/null || ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3
          fi

      - name: Install
        run: npm ci

      - name: Build (the test needs media/webview)
        run: npm run build

      - name: Run the extension test
        run: xvfb-run -a npm test -w morse
