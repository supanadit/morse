<div class="terminal-view">
  <div class="tabbar" role="tablist" aria-label="Terminals">
    @for (terminal of mine(); track terminal.id) {
      <div
        class="ttab"
        role="tab"
        tabindex="0"
        [class.active]="terminal.id === activeId()"
        [attr.aria-selected]="terminal.id === activeId()"
        [title]="terminal.title"
        (click)="select(terminal.id)"
        (keydown.enter)="select(terminal.id)"
        (auxclick)="onAuxClick(terminal.id, $event)"
      >
        <span class="glyph" aria-hidden="true">❯</span>
        <span class="label">{{ terminal.title }}</span>
        <button
          type="button"
          class="close"
          aria-label="Close terminal"
          [title]="'Close ' + terminal.title"
          (click)="close(terminal.id, $event)"
        >
          ×
        </button>
      </div>
    }
  </div>

  <div class="screens">
    @if (mine().length === 0) {
      <p class="empty">No terminals in this session.</p>
    }
    @for (terminal of all(); track terminal.id) {
      <morse-terminal
        class="screen-host"
        [class.hidden]="terminal.id !== activeId()"
        [id]="terminal.id"
      />
    }
  </div>
</div>
