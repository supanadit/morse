<section
  class="panel"
  [class.expanded]="expanded()"
  [style.height.px]="expanded() && !full() ? height() ?? defaultHeight : null"
>
  @if (expanded() && !full()) {
    <div
      class="resize"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize the bottom panel"
      title="Drag to resize"
      (pointerdown)="onResizeStart($event)"
      (dblclick)="onResizeReset()"
    ></div>
  }

  <div class="bar">
    <div class="chips" role="tablist" aria-label="Bottom panel">
      @for (view of views; track view.id) {
        <div
          class="chip"
          [class.active]="activeView() === view.id && expanded()"
          [class.with-actions]="activeView() === view.id && expanded() && actions().length > 0"
        >
          <button
            type="button"
            class="chip-label"
            role="tab"
            [attr.aria-selected]="activeView() === view.id && expanded()"
            (click)="select(view.id)"
          >
            {{ view.label }}
          </button>
          @if (activeView() === view.id && expanded()) {
            @for (action of actions(); track action.label) {
              <button
                type="button"
                class="chip-action"
                [title]="action.title"
                [attr.aria-label]="action.title"
                (click)="action.run()"
              >
                {{ action.label }}
              </button>
            }
          }
        </div>
      }
    </div>
    <span class="grow"></span>
    <button
      type="button"
      class="toggle"
      [title]="full() ? 'Fit the panel back below the chat' : 'Expand the panel to full screen'"
      [attr.aria-label]="full() ? 'Exit full screen' : 'Full screen'"
      [attr.aria-pressed]="full()"
      (click)="toggleFull()"
    >
      @if (full()) {
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 6.5h3v-3" />
          <path d="M12.5 9.5h-3v3" />
          <path d="M6.5 6.5 3 3" />
          <path d="M9.5 9.5 13 13" />
        </svg>
      } @else {
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6.5 3.5h-3v3" />
          <path d="M9.5 12.5h3v-3" />
          <path d="M3.5 3.5 8 8" />
          <path d="M12.5 12.5 8 8" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="toggle"
      [title]="expanded() ? 'Collapse panel' : 'Expand panel'"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Collapse panel' : 'Expand panel'"
      (click)="toggleExpanded()"
    >
      @if (expanded()) {
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 6.5 8 10.5 12 6.5" />
        </svg>
      } @else {
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 9.5 8 5.5 12 9.5" />
        </svg>
      }
    </button>
  </div>

  <!-- Folded, the body keeps its component (and its shell) and only loses space. -->
  <div class="body" [class.hidden]="!expanded()">
    @if (activeView(); as view) {
      @if (componentFor(view); as component) {
        <ng-container [ngComponentOutlet]="component" />
      }
    } @else {
      <p class="empty">Choose a tool above.</p>
    }
  </div>
</section>
