<button
  type="button"
  class="trigger"
  [attr.aria-expanded]="open()"
  [attr.aria-busy]="loading() ? 'true' : null"
  aria-haspopup="listbox"
  [title]="
    loading()
      ? 'Reading the thinking levels of the selected model'
      : 'Thinking level: ' + current()
  "
  (click)="toggle()"
>
  <morse-brain [level]="current()" />
  <span class="level">{{ current() }}</span>
  @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
  } @else {
    <span class="caret" aria-hidden="true">▾</span>
  }
</button>

@if (open()) {
  <div
    #panel
    class="panel"
    role="listbox"
    aria-label="Thinking level"
    [attr.aria-busy]="loading() ? 'true' : null"
    tabindex="-1"
    [morseEnter]="0"
    [morseEnterY]="6"
    (keydown)="onKeydown($event)"
  >
    @if (loading()) {
      <div class="status" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Reading this model&#8217;s levels&#8230;</span>
      </div>
    }
    @for (level of levels(); track level; let index = $index) {
      <button
        type="button"
        class="row"
        role="option"
        [class.active]="!loading() && index === active()"
        [class.selected]="level === current()"
        [disabled]="loading()"
        [attr.aria-selected]="level === current()"
        (mouseenter)="active.set(index)"
        (click)="choose(level)"
      >
        <morse-brain [level]="level" />
        <span class="name">{{ level }}</span>
        @if (level === current()) {
          <span class="check" aria-hidden="true">✓</span>
        }
      </button>
    }
  </div>
}
