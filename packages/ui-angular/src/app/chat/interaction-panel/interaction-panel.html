@if (visible() && request(); as req) {
  <section class="dialog" role="dialog" aria-live="polite">
    <header>{{ req.title }}</header>

    @switch (req.kind) {
      @case ('select') {
        @if (messageOf(req); as message) {
          <p class="muted">{{ message }}</p>
        }
        <div class="options">
          @for (option of optionsOf(req); track option.value) {
            <button type="button" class="secondary" (click)="choose(option.value)">
              {{ option.label }}
            </button>
          }
        </div>
      }
      @case ('confirm') {
        <p>{{ messageOf(req) }}</p>
        <div class="options">
          <button type="button" (click)="decide(true)">Yes</button>
          <button type="button" class="secondary" (click)="decide(false)">No</button>
        </div>
      }
      @case ('input') {
        <input
          type="text"
          [value]="value()"
          [placeholder]="placeholderOf(req)"
          (input)="onInput($event)"
        />
        <div class="options">
          <button type="button" (click)="submit()">Submit</button>
          <button type="button" class="secondary" (click)="cancel()">Cancel</button>
        </div>
      }
      @case ('editor') {
        <textarea rows="5" [value]="value()" (input)="onInput($event)"></textarea>
        <div class="options">
          <button type="button" (click)="submit()">Submit</button>
          <button type="button" class="secondary" (click)="cancel()">Cancel</button>
        </div>
      }
    }
  </section>
}
