<div class="pane-head">
  @if (!collapsed()) {
    <div
      class="resize"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize the file explorer"
      title="Drag to resize"
      (pointerdown)="startResize($event)"
    ></div>
  }
  <button
    type="button"
    class="pane-toggle"
    [attr.aria-expanded]="!collapsed()"
    (click)="toggleFold()"
  >
    <span class="chevron" [class.open]="!collapsed()">›</span>
    <span class="pane-title">Explorer</span>
    <span class="pane-count">{{ fileCount() }}</span>
  </button>
  <button type="button" class="icon" title="Refresh files" aria-label="Refresh files" (click)="refresh()">
    ⟳
  </button>
</div>

@if (!collapsed()) {
  <div class="rows">
    @if (isLoading() && rows().length === 0) {
      <p class="hint">Loading files…</p>
    } @else if (errorMessage(); as message) {
      <p class="hint error">{{ message }}</p>
    } @else if (rows().length === 0) {
      <p class="hint">No files found.</p>
    } @else {
      @for (row of rows(); track row.node.path) {
        <button
          type="button"
          class="row"
          [class.dir]="row.node.kind === 'dir'"
          [style.paddingLeft.px]="6 + row.depth * 12"
          [title]="row.node.path"
          (click)="onRow(row.node)"
        >
          <span class="glyph" aria-hidden="true">{{ glyph(row.node) }}</span>
          <span class="name">{{ row.node.name }}</span>
          @if (row.node.kind === 'file') {
            @if (changeOf(row.node.path); as change) {
              <span [class]="'badge ' + change" [title]="badgeTitle(change)">{{ change }}</span>
            }
          } @else if (dirChanged(row.node.path)) {
            <span class="dot" title="Contains changes" aria-hidden="true"></span>
          }
        </button>
      }
    }
  </div>
}
