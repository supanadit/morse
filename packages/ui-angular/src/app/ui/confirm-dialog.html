<morse-dialog
  labelledBy="confirm-title"
  [describedBy]="body().length > 0 ? 'confirm-body' : undefined"
  role="alertdialog"
  (dismiss)="cancelled.emit()"
>
  <h2 id="confirm-title">{{ title() }}</h2>
  @if (body(); as text) {
    <p class="body" id="confirm-body">{{ text }}</p>
  }
  @if (note(); as text) {
    <p class="note">{{ text }}</p>
  }

  <div class="actions">
    <!-- Cancel first in the DOM *and* focused: the safe choice is the default. -->
    <button type="button" class="secondary" #cancel (click)="cancelled.emit()">
      {{ cancelLabel() }}
    </button>
    <button type="button" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
  </div>
</morse-dialog>
