<!-- The CodeMirror view owns the host div; the band pairs are Angular's. -->
<div
  class="morse-code-area"
  (pointermove)="trackPointer($event)"
  (pointerleave)="clearPointer()"
>
  <div class="morse-editor-host" #host></div>
  @if (bandActions().length) {
    <div class="morse-band-track" #bandTrack>
      @for (action of bandActions(); track action.pin.id) {
        <morse-pin-actions
          class="morse-band-actions"
          [class.shown]="!dismissed() && hoveredPinId() === action.pin.id"
          [style.top.px]="action.top"
          [note]="action.pin.note"
          [target]="'range ' + pinRangeLabel(action.pin) + ' of ' + path()"
          (edit)="openNote(action.pin, $event)"
          (cancel)="unpinPin(action.pin)"
        />
      }
    </div>
  }
</div>
@if (noteEditing(); as editing) {
  @if (noteTarget(); as target) {
    <morse-pin-annotation
      [anchor]="editing.anchor"
      [target]="target"
      [note]="editing.pin.note ?? ''"
      (save)="saveNote($event)"
      (cancel)="noteEditing.set(undefined)"
    />
  }
}
