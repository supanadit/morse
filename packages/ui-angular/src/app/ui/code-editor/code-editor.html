<!-- The CodeMirror view owns the host div; the rail beside it is Angular's. -->
<div class="morse-editor-host" #host></div>
@if (cards().length) {
  <div class="morse-rail" [class.overflow]="railOverflow()">
    <div class="morse-rail-track" #track [style.height.px]="railOverflow() ? railHeight() : null">
      @for (card of cards(); track card.pin.id) {
        <article class="morse-card" [style.top.px]="card.top">
          <header class="morse-card-head">
            <span class="morse-card-range">{{ card.label }}</span>
            <button
              type="button"
              class="morse-card-edit"
              title="Edit the note"
              [attr.aria-label]="'Edit the note on ' + card.label"
              (click)="openNote(card, $event)"
            >
              ✎
            </button>
            <button
              type="button"
              class="morse-card-remove"
              title="Unpin this range"
              [attr.aria-label]="'Unpin ' + card.label"
              (click)="unpin(card)"
            >
              ⌫
            </button>
          </header>
          @if (card.pin.note) {
            <morse-markdown class="morse-card-note" [text]="card.pin.note" />
          } @else {
            <span class="morse-card-note ghost">Add a note…</span>
          }
        </article>
      }
    </div>
  </div>
}
@if (pill(); as p) {
  <button
    type="button"
    class="morse-pin-pill"
    [style.left.px]="p.left"
    [style.top.px]="p.top"
    [attr.aria-label]="'Pin ' + p.label + ' to this message'"
    (click)="confirmPill(p)"
  >
    ⧉ Pin {{ p.label }}
  </button>
}
@if (noteEditing(); as editing) {
  @if (noteTarget(); as target) {
    <morse-pin-annotation
      [anchor]="editing.anchor"
      [target]="target"
      [note]="editing.pin.note ?? ''"
      (save)="saveNote($event)"
      (cancel)="noteEditing.set(undefined)"
    />
  }
}
