<div
  #card
  class="pin-annotation"
  [class.above]="spot().placement === 'above'"
  [style.top.px]="spot().top"
  [style.left.px]="spot().left"
  role="dialog"
  aria-label="Annotate the pinned range"
>
  <header class="head">
    <span class="avatar" aria-hidden="true">
      <svg viewBox="0 0 16 16">
        <circle cx="8" cy="5" r="2.6" />
        <path d="M2.6 14c0-2.8 2.4-4.6 5.4-4.6s5.4 1.8 5.4 4.6" />
      </svg>
    </span>
    <div class="heading">
      <span class="title">Add a comment</span>
      <span class="subtitle">
        <span class="target" [title]="target().path">{{ target().path }}</span>
        @if (target().range; as range) {
          <span class="range">{{ range }}</span>
        }
      </span>
    </div>
    <button
      type="button"
      class="icon"
      title="Close without saving"
      aria-label="Close without saving"
      (click)="close()"
    >
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8" />
      </svg>
    </button>
  </header>

  <div class="tabs">
    <!-- The single mode, so a label rather than a control: nothing to switch to yet. -->
    <span class="tab on">Write</span>
    <span class="grow"></span>
    <div class="tools" role="toolbar" aria-label="Markdown formatting">
      <!-- Every button cancels its own mousedown: a toolbar press must not take
           the caret out of the textarea, or the selection the tool acts on is gone. -->
      <button
        type="button"
        title="Bold (⌘/Ctrl+B)"
        aria-label="Bold"
        (mousedown)="$event.preventDefault()"
        (click)="bold()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 2.5h4.2a3 3 0 0 1 0 6H4.5zM4.5 8.5h4.8a3 3 0 0 1 0 6H4.5z" />
        </svg>
      </button>
      <button
        type="button"
        title="Italic (⌘/Ctrl+I)"
        aria-label="Italic"
        (mousedown)="$event.preventDefault()"
        (click)="italic()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M7 2.5h5M4 13.5h5M9.5 2.5 6.5 13.5" />
        </svg>
      </button>
      <button
        type="button"
        title="Quote"
        aria-label="Quote"
        (mousedown)="$event.preventDefault()"
        (click)="quote()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h2.5v7H3zM10.5 4.5H13v7h-2.5z" />
        </svg>
      </button>
      <button
        type="button"
        title="Inline code (⌘/Ctrl+E)"
        aria-label="Inline code"
        (mousedown)="$event.preventDefault()"
        (click)="inlineCode()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 4 2.5 8 6 12M10 4l3.5 4L10 12" />
        </svg>
      </button>
      <button
        type="button"
        title="Link (⌘/Ctrl+K)"
        aria-label="Link"
        (mousedown)="$event.preventDefault()"
        (click)="link()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.1-2.1a2.6 2.6 0 0 0-3.7-3.7l-1 1" />
          <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.6 8.7a2.6 2.6 0 0 0 3.7 3.7l1-1" />
        </svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button
        type="button"
        title="Bulleted list"
        aria-label="Bulleted list"
        (mousedown)="$event.preventDefault()"
        (click)="bullet()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.6 4.2h.01M2.6 8h.01M2.6 11.8h.01" />
          <path d="M6 4.2h7.4M6 8h7.4M6 11.8h7.4" />
        </svg>
      </button>
      <button
        type="button"
        title="Numbered list"
        aria-label="Numbered list"
        (mousedown)="$event.preventDefault()"
        (click)="ordered()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4h1.4v3.2M1.8 10.4c.2-.5.7-.8 1.2-.8.7 0 1.2.5 1.2 1.1 0 1-2.4 1.1-2.4 2.3h2.5" />
          <path d="M7 5.6h7M7 11h7" />
        </svg>
      </button>
      <button
        type="button"
        title="Code block"
        aria-label="Code block"
        (mousedown)="$event.preventDefault()"
        (click)="codeBlock()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.5" y="3.5" width="11" height="9" rx="1.2" />
          <path d="M2.5 6.2h11" />
        </svg>
      </button>
      <button
        type="button"
        title="Heading"
        aria-label="Heading"
        (mousedown)="$event.preventDefault()"
        (click)="heading()"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 3.5v9M12 3.5v9M4 8h8" />
        </svg>
      </button>
    </div>
  </div>

  <div class="editor">
    <!-- The mirror is what the eye sees; the textarea over it is what you type. -->
    <pre class="mirror" #mirror aria-hidden="true"><code [innerHTML]="mirrorHtml()"></code></pre>
    <textarea
      #input
      class="input"
      [attr.placeholder]="placeholder"
      spellcheck="false"
      [value]="note()"
      [attr.aria-label]="'Annotation for ' + target().path"
      (input)="onInput($event)"
      (scroll)="onScroll()"
      (keydown)="onKeydown($event)"
    ></textarea>
  </div>

  <footer>
    <span class="hint">{{ shortcutHint }}</span>
    <span class="grow"></span>
    <button type="button" class="secondary" (click)="close()">Cancel</button>
    <button type="button" (click)="commit()">Save comment</button>
  </footer>
</div>
