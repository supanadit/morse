<div class="bar">
  <!--
       The switches for the columns sit on the side of the column they move: the fold and
       the drawer at the left, next to the navigation column, and the git column's switch
       at the right, next to it.
  -->
  <!--
       The bar is the window's chrome, in three parts. The identity (the drawer and
       fold switches, the wordmark, the status dot) and the command centre share row
       one; the conversation's buttons and the column switches are pinned to the right
       of that row. When the bar is too narrow for all three, the command centre drops
       to a second row and the other two stay exactly where they were.
  -->
  <span class="identity">
  <button
    type="button"
    class="icon menu"
    title="Sessions and projects"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="navigationOpen()"
    (click)="toggleNavigation()"
  >
    ☰
  </button>

  <button
    type="button"
    class="icon collapse"
    [title]="collapsed() ? 'Show the sidebar' : 'Hide the sidebar'"
    [attr.aria-label]="collapsed() ? 'Show the sidebar' : 'Hide the sidebar'"
    [attr.aria-expanded]="!collapsed()"
    (click)="toggleSidebar()"
  >
    <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="2" y="3.5" width="12" height="9" rx="1.5" />
      <path d="M6.5 3.5v9" />
    </svg>
  </button>

  <span class="wordmark">Morse</span>

  <span
    class="status"
    [class.online]="status() === 'ready'"
    [class.busy]="status() === 'starting'"
    [class.failed]="status() === 'error' || status() === 'closed'"
    [title]="statusTitle()"
  >
    <span class="dot" aria-hidden="true"></span>
    @if (status() !== 'ready') {
      <span class="status-text">{{ statusLabel() }}</span>
    }
  </span>
  </span>

  <!--
       The conversation's buttons and the column switches, one group. The grid places
       them in the bar's right track; they never shrink and never split.
  -->
  <span class="actions">

  @if (!noSessionInFront()) {
    <button
      type="button"
      class="icon"
      [title]="
        compactTools()
          ? 'Tool calls: compact — click for the legacy timeline'
          : 'Tool calls: legacy timeline — click for the compact tree'
      "
      [attr.aria-label]="'Tool call display: ' + (compactTools() ? 'compact' : 'timeline')"
      [attr.aria-pressed]="compactTools()"
      (click)="toggleToolDisplay()"
    >
      @if (compactTools()) {
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 6h10M3 10h6" />
        </svg>
      } @else {
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h10M3 8h10M3 11.5h10" />
        </svg>
      }
    </button>
  }

  <button
    type="button"
    class="icon"
    [title]="compactTitle()"
    aria-label="Compact the conversation"
    [disabled]="!state().agentReady || noSessionInFront()"
    (click)="compact()"
  >
    <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 3 8 6.6l4-3.6" />
      <path d="M4 13 8 9.4l4 3.6" />
    </svg>
  </button>

  @if (promptsEnabled()) {
    <button
      type="button"
      class="icon prompts"
      [class.on]="promptsOpen()"
      [title]="promptsOpen() ? 'Prompt templates — in front' : 'Edit prompt templates'"
      [attr.aria-label]="'Edit prompt templates'"
      [attr.aria-pressed]="promptsOpen()"
      (click)="openPrompts()"
    >
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.5 2.5h5l3 3v8h-8z" />
        <path d="M8.5 2.5v3h3" />
        <path d="M5.5 8.5h5M5.5 11h3" />
      </svg>
    </button>
  }

  @if (mcpEnabled()) {
    <button
      type="button"
      [class]="'icon mcp ' + mcpOverall()"
      [title]="mcpTitle()"
      aria-label="MCP servers"
      (click)="openMcp()"
    >
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="2.5" y="3" width="11" height="4.4" rx="1.2" />
        <rect x="2.5" y="8.6" width="11" height="4.4" rx="1.2" />
        <circle cx="5" cy="5.2" r="0.6" />
        <circle cx="5" cy="10.8" r="0.6" />
      </svg>
      <span class="mcp-dot" aria-hidden="true"></span>
    </button>
  }

  @if (gitEnabled()) {
    <button
      type="button"
      class="icon"
      [title]="gitOpen() ? 'Hide the git panel' : 'Show the git panel'"
      [attr.aria-label]="gitOpen() ? 'Hide the git panel' : 'Show the git panel'"
      [attr.aria-pressed]="gitOpen()"
      (click)="toggleGit()"
    >
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="4.5" cy="3.5" r="1.6" />
        <circle cx="4.5" cy="12.5" r="1.6" />
        <circle cx="11.5" cy="6.5" r="1.6" />
        <path d="M4.5 5.1v5.8" />
        <path d="M4.5 5.1c0 2.4 7 1 7 3" />
      </svg>
    </button>
  }
  </span>
  <!--
       The command centre: the grid's flexible middle track while the bar is wide, and
       its own full-width second row when the bar is tight — the one thing that moves, so
       the identity and the buttons above stay put.
  -->
  <button
    type="button"
    class="command"
    [attr.aria-expanded]="paletteOpen()"
    title="Search or run a command"
    (click)="openPalette()"
  >
    <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="7" cy="7" r="4.2" />
      <path d="M10.2 10.2 14 14" />
    </svg>
    <span>Search or run a command</span>
  </button>

</div>
