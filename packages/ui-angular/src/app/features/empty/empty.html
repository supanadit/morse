<div class="empty-session" role="status">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 16 16">
      <rect x="2.5" y="3.5" width="11" height="9" rx="1.5" />
      <path d="M5.5 6.5h5M5.5 9.5h3" />
    </svg>
  </span>
  <h2>No session open</h2>
  <p>
    @if (hasTabs()) {
      Pick a session from the tabs above or the sidebar, or start a new one.
    } @else {
      Start a new session to talk to the pi agent.
    }
  </p>
  <button type="button" (click)="create.emit()">New session</button>
</div>
