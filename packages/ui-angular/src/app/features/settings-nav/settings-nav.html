<!--
  The host's settings, drawn with the session list's own pane + tree: each
  section folds like a project, each page is a leaf under it. A new page is a
  leaf here, a subsection a nested group — no new component either way.
-->
<morse-pane class="settings" title="Settings">
  <div class="list">
    <morse-tree
      [nodes]="treeNodes()"
      [expanded]="expanded()"
      [selected]="selected()"
      empty="Nothing to show."
      (activate)="onActivate($event)"
      (toggle)="onToggle($event)"
    />
  </div>
</morse-pane>
